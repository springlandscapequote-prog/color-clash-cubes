name: Stamp version
# Every push to main gets a fresh version.json / js/version.js / ?v= stamp, so phones always load the newest game.
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  stamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Stamp (skipped when the pushed commit already stamped it by hand, e.g. via release.sh)
        run: |
          if git diff --quiet HEAD~1 HEAD -- version.json 2>/dev/null; then ./stamp.sh; else echo "already stamped by hand"; fi
      - name: Commit stamp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json js/version.js index.html
          git diff --cached --quiet || (git commit -m "chore: stamp version [skip ci]" && git push)
